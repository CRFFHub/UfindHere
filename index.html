        // Elementos da tela
        const groupsContainer = document.getElementById('groupsContainer');
        const subgroupsSection = document.getElementById('subgroupsSection');
        const subgroupsTitle = document.getElementById('subgroupsTitle');
        const subgroupsContainer = document.getElementById('subgroupsContainer');
        const resultsSection = document.getElementById('resultsSection');
        const selectedSubgroupTitle = document.getElementById('selectedSubgroupTitle');
        const professionalsList = document.getElementById('professionalsList');
        const searchInput = document.getElementById('searchInput');
        const closeAllBtn = document.getElementById('closeAllBtn');

        let grupoAtual = null;
        let subgrupoAtual = null;

        function carregarGrupos() {
            groupsContainer.innerHTML = '';
            estruturaCategorias.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'group-btn';
                btn.innerHTML = `<span class="icon">${item.icone}</span><span>${item.grupo}</span>`;
                
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    abrirSubgrupos(item);
                });

                groupsContainer.appendChild(btn);
            });
        }

        function abrirSubgrupos(itemGrupo) {
            grupoAtual = itemGrupo.grupo;
            subgrupoAtual = null;
            resultsSection.style.display = 'none';
            
            subgroupsTitle.textContent = `2. Opções em "${itemGrupo.grupo}":`;
            subgroupsContainer.innerHTML = '';

            itemGrupo.subgrupos.forEach(sub => {
                const subBtn = document.createElement('button');
                subBtn.className = 'subgroup-btn';
                subBtn.textContent = sub;

                subBtn.addEventListener('click', () => {
                    document.querySelectorAll('.subgroup-btn').forEach(b => b.classList.remove('active'));
                    subBtn.classList.add('active');
                    abrirProfissionais(sub);
                });

                subgroupsContainer.appendChild(subBtn);
            });

            subgroupsSection.style.display = 'block';
            subgroupsSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function abrirProfissionais(subgrupo) {
            subgrupoAtual = subgrupo;
            selectedSubgroupTitle.textContent = `Indicados em: ${subgrupo}`;
            searchInput.value = '';
            
            resultsSection.style.display = 'block';
            renderizarCards();
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function renderizarCards() {
            const termo = searchInput.value.toLowerCase();
            professionalsList.innerHTML = '';

            const filtrados = profissionais.filter(prof => {
                // Suporta tanto 1 subgrupo (string) quanto vários subgrupos (array)
                const mesmoSubgrupo = Array.isArray(prof.subgrupo) 
                    ? prof.subgrupo.includes(subgrupoAtual) 
                    : prof.subgrupo === subgrupoAtual;

                const regiaoTexto = prof.regiao ? prof.regiao.toLowerCase() : '';
                const valorTexto = prof.valor ? prof.valor.toLowerCase() : '';
                const anoTexto = prof.ano ? prof.ano.toLowerCase() : '';
                const kmTexto = prof.km ? prof.km.toLowerCase() : '';
                const instagramTexto = prof.instagram ? prof.instagram.toLowerCase() : '';
                const emailTexto = prof.email ? prof.email.toLowerCase() : '';

                const bateBusca = prof.nome.toLowerCase().includes(termo) || 
                                  prof.resumo.toLowerCase().includes(termo) ||
                                  regiaoTexto.includes(termo) ||
                                  valorTexto.includes(termo) ||
                                  anoTexto.includes(termo) ||
                                  kmTexto.includes(termo) ||
                                  instagramTexto.includes(termo) ||
                                  emailTexto.includes(termo);
                return mesmoSubgrupo && bateBusca;
            });

            if (filtrados.length === 0) {
                professionalsList.innerHTML = '<p class="empty-message">Nenhum indicado cadastrado nesta opção ainda.</p>';
                return;
            }

            filtrados.forEach(prof => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const badgeRegiao = prof.regiao ? `<div class="region-badge">📍 Região Atendida: ${prof.regiao}</div>` : '';

                // Monta as tags de Valor, Ano e KM se estiverem preenchidas
                let badgesInfoHTML = '';
                if (prof.valor || prof.ano || prof.km) {
                    badgesInfoHTML += `<div class="info-badges-container">`;
                    if (prof.valor) {
                        badgesInfoHTML += `<span class="price-badge">💰 ${prof.valor}</span>`;
                    }
                    if (prof.ano) {
                        badgesInfoHTML += `<span class="spec-badge">📅 Ano: ${prof.ano}</span>`;
                    }
                    if (prof.km) {
                        badgesInfoHTML += `<span class="spec-badge">🛣️ ${prof.km}</span>`;
                    }
                    badgesInfoHTML += `</div>`;
                }

                // Monta os botões de Instagram/Site e E-mail se estiverem preenchidos
                let extraLinksHTML = '';
                if (prof.instagram || prof.email) {
                    extraLinksHTML += `<div class="card-extra-links">`;
                    if (prof.instagram) {
                        const rawSocial = prof.instagram.trim();
                        if (rawSocial.startsWith('http://') || rawSocial.startsWith('https://')) {
                            const labelSite = rawSocial.includes('instagram.com') ? '📸 Instagram' : (rawSocial.includes('linkedin.com') ? '💼 LinkedIn' : '🌐 Site');
                            extraLinksHTML += `<a href="${rawSocial}" target="_blank" class="btn-social btn-instagram">${labelSite}</a>`;
                        } else {
                            const cleanInsta = rawSocial.replace(/^@+/, '').replace(/\/+$/, '');
                            extraLinksHTML += `<a href="https://instagram.com/${cleanInsta}" target="_blank" class="btn-social btn-instagram">📸 @${cleanInsta}</a>`;
                        }
                    }
                    if (prof.email) {
                        extraLinksHTML += `<a href="mailto:${prof.email}" class="btn-social btn-email">✉️ E-mail</a>`;
                    }
                    extraLinksHTML += `</div>`;
                }

                const mensagemWhatsApp = encodeURIComponent(`Olá ${prof.nome.trim()}, vi sua indicação na área de ${subgrupoAtual} no UfindHere!`);

                card.innerHTML = `
                    <div>
                        <h3>${prof.nome}</h3>
                        ${badgeRegiao}
                        ${badgesInfoHTML}
                        <p class="bio">${prof.resumo}</p>
                    </div>
                    <div class="card-footer">
                        <div class="card-main-info">
                            <span class="phone">📞 ${prof.telefone}</span>
                            <a href="https://wa.me/${prof.whatsapp}?text=${mensagemWhatsApp}" target="_blank" class="btn-whatsapp">WhatsApp</a>
                        </div>
                        ${extraLinksHTML}
                    </div>
                `;
                professionalsList.appendChild(card);
            });
        }

        closeAllBtn.addEventListener('click', () => {
            resultsSection.style.display = 'none';
            document.querySelectorAll('.subgroup-btn').forEach(b => b.classList.remove('active'));
            subgrupoAtual = null;
        });

        searchInput.addEventListener('input', renderizarCards);

        carregarGrupos();
    </script>
